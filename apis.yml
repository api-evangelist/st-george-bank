  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.stgeorge.com.au/online-services/open-banking
  baseURL: https://digital-api.stgeorge.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.stgeorge.com.au/online-services/open-banking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#cdr-banking-api_get-transactions-for-account
    type: APIReference
  - url: openapi/st-george-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorised (ADR-gated) Consumer Data Right data-sharing surface
    covering the Get Transactions For Account and Get Transaction Detail operations of
    the shared DSB Consumer Data Standards Banking API, exposing transaction history
    for a consenting customer's eligible accounts. These endpoints require an accredited
    data recipient acting under an active consent over the CDR ADR model (mTLS +
    OAuth2/OIDC FAPI) and are not publicly probeable. St.George implements this
    standardised industry surface as a designated CDR Data Holder.
- aid: st-george-bank:st-george-bank-cdr-direct-debits-scheduled-payments-api
