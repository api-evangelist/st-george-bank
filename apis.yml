apis:
- aid: st-george-bank:st-george-bank-cdr-product-reference-data-api
  name: St.George Bank CDR Product Reference Data API
  tags:
  - Open Banking
  - CDR
  - Product Reference Data
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.stgeorge.com.au/online-services/open-banking/product-api
  baseURL: https://digital-api.stgeorge.com.au/cds-au/v1/banking/products
  properties:
  - url: https://www.stgeorge.com.au/online-services/open-banking/product-api
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#cdr-banking-api_get-products
    type: APIReference
  - url: openapi/st-george-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Public, unauthenticated Consumer Data Right Product Reference Data (PRD)
    API exposing St.George's openly available banking product catalogue (transaction
    and savings accounts, credit cards, loans, term deposits) under the standard CDS
    path /cds-au/v1/banking/products. Confirmed live returning HTTP 200 with a data.products
    array; supports x-v versions 4 and 5. Covers the Get Products and Get Product Detail
    operations of the shared DSB Consumer Data Standards Banking API contract (this is
    the standardised industry surface, not a St.George-proprietary API).
- aid: st-george-bank:st-george-bank-cdr-accounts-balances-api
  name: St.George Bank CDR Accounts & Balances API
  tags:
  - Open Banking
  - CDR
  - Accounts
  - Balances
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.stgeorge.com.au/online-services/open-banking
  baseURL: https://digital-api.stgeorge.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.stgeorge.com.au/online-services/open-banking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#cdr-banking-api_get-accounts
    type: APIReference
  - url: openapi/st-george-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorised (ADR-gated) Consumer Data Right data-sharing surface
    covering the Get Accounts, Get Bulk Balances, Get Account Balance and Get Account
    Detail operations of the shared DSB Consumer Data Standards Banking API. Unlike the
    public Product Reference Data API, these endpoints require an accredited data
    recipient acting on behalf of a consenting customer over the CDR ADR model
    (mTLS + OAuth2/OIDC FAPI), so they are not publicly probeable. St.George is legally
    required to implement this standardised industry surface as a designated Data Holder.
