name: St.George Bank
kind: company
description: St.George Bank is one of Australia's largest retail and business banks
  and a division of Westpac Banking Corporation (ASX:WBC), one of the country's "Big
  Four" banks. Originally a New South Wales building society that grew into an independent
  ADI, St.George merged into the Westpac Group in 2008 and today operates as a Westpac
  brand alongside BankSA, Bank of Melbourne and RAMS. As an authorised deposit-taking
  institution it is a designated Data Holder under Australia's Consumer Data Right
  (CDR / Open Banking), and therefore exposes a public, unauthenticated Product Reference
  Data (PRD) API conforming to the DSB Consumer Data Standards, alongside the consented,
  ADR-gated CDR data-sharing APIs. St.George does not operate a broad public developer
  portal beyond its CDR Open Banking surface.
