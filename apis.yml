  - Scheduled Payments
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.stgeorge.com.au/online-services/open-banking
  baseURL: https://digital-api.stgeorge.com.au/cds-au/v1/banking/accounts/direct-debits
  properties:
  - url: https://www.stgeorge.com.au/online-services/open-banking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#cdr-banking-api_get-direct-debits-for-account
    type: APIReference
  - url: openapi/st-george-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorised (ADR-gated) Consumer Data Right data-sharing surface
    covering the Get Direct Debits (per-account and bulk) and Get Scheduled Payments
    (per-account and bulk) operations of the shared DSB Consumer Data Standards Banking
    API, exposing a consenting customer's authorised direct-debit arrangements and
    scheduled/recurring payments. These endpoints require an accredited data recipient
    acting under an active consent over the CDR ADR model (mTLS + OAuth2/OIDC FAPI) and
    are not publicly probeable. St.George implements this standardised industry surface
    as a designated CDR Data Holder.
- aid: st-george-bank:st-george-bank-cdr-payees-api
  name: St.George Bank CDR Payees API
  tags:
  - Open Banking
  - CDR
