  - url: https://consumerdatastandardsaustralia.github.io/standards/#cdr-banking-api_get-payees
    type: APIReference
  - url: openapi/st-george-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorised (ADR-gated) Consumer Data Right data-sharing surface
    covering the Get Payees and Get Payee Detail operations of the shared DSB Consumer
    Data Standards Banking API, exposing the saved payees a consenting customer has
    configured for their eligible accounts. These endpoints require an accredited data
    recipient acting under an active consent over the CDR ADR model (mTLS + OAuth2/OIDC
    FAPI) and are not publicly probeable. St.George implements this standardised
    industry surface as a designated CDR Data Holder.
